# ═══════════════════════════════════════════════════════════════
# NEXUS IA v6.0 — docker-compose.yml
#
# Levanta el stack completo:
#   - postgres    (base de datos, red aislada)
#   - orchestrator (backend Go + frontend Next.js embebido)
#   - backup      (copia diaria verificada de la base de datos)
#   - https       (perfil "https": Caddy con certificado automático)
#
# Obligatorio antes de arrancar: POSTGRES_PASSWORD en .env (no hay valor por
# defecto). La API escucha solo en 127.0.0.1; en producción se publica con el
# servicio https (NEXUS_DOMAIN en .env).
#
# Uso:
#   make up        → arranca el stack (solo local)
#   make up-https  → arranca el stack publicado en https://NEXUS_DOMAIN
#   make down    → para el stack
#   make logs    → logs en vivo
# ═══════════════════════════════════════════════════════════════

name: nexus-ia

services:
  # ─────────────────────────────────────────────────────────────
  # POSTGRES — Base de datos
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB:       ${POSTGRES_DB:-nexus}
      # Evitar warnings en logs
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nexus_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No exponer puerto al host (solo red interna)
    # Para debug: descomentar
    # ports:
    #   - "127.0.0.1:5432:5432"

  # ─────────────────────────────────────────────────────────────
  # ORCHESTRATOR — Backend Go + Frontend Next.js embebido
  # ─────────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache de capas (acelera rebuilds)
      cache_from:
        - nexus-ia/orchestrator:latest
    image: nexus-ia/orchestrator:v6.0.0
    container_name: nexus-orchestrator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Base de datos
      NEXUS_PG_DSN: "postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-nexus}?sslmode=disable"
      # Ollama en el host Windows
      OLLAMA_HOST: "http://host.docker.internal:11434"
      # Modelos por defecto (tier micro)
      NEXUS_LLM_PROVIDER: "ollama"
      NEXUS_LLM_MODEL:    "${MODEL_AGENTS:-qwen3:4b}"
      NEXUS_DEFAULT_LANG: "${NEXUS_DEFAULT_LANG:-es}"
      # Estado
      ENV_STATE:          "${ENV_STATE:-production}"
      LOG_LEVEL:          "${LOG_LEVEL:-INFO}"
      NEXUS_SKILL_DIR:     "/app/data/skills"
      NEXUS_MEMORY_ENABLED: "${NEXUS_MEMORY_ENABLED:-true}"
      # Portal de clientes: URL pública (enlaces de los emails) y correo saliente.
      # Sin NEXUS_SMTP_HOST los emails solo se escriben en el log (no llegan).
      NEXUS_PORTAL_BASE_URL:  "${NEXUS_PORTAL_BASE_URL:-}"
      NEXUS_CONSOLE_BASE_URL: "${NEXUS_CONSOLE_BASE_URL:-}"
      NEXUS_SMTP_HOST:        "${NEXUS_SMTP_HOST:-}"
      NEXUS_SMTP_PORT:        "${NEXUS_SMTP_PORT:-587}"
      NEXUS_SMTP_USER:        "${NEXUS_SMTP_USER:-}"
      NEXUS_SMTP_PASS:        "${NEXUS_SMTP_PASS:-}"
      NEXUS_SMTP_FROM:        "${NEXUS_SMTP_FROM:-}"
      NEXUS_OPS_EMAIL:        "${NEXUS_OPS_EMAIL:-}"
      # Único proxy autorizado a indicar la IP real del cliente (límites por
      # IP, bloqueo de fuerza bruta, auditoría y lista de redes permitidas).
      NEXUS_TRUSTED_PROXIES:  "${NEXUS_PROXY_IP:-172.29.80.10}"
      # Vigilancia de operación (docs/engineering/MONITORING.md): avisa a
      # NEXUS_OPS_EMAIL si la última copia es más antigua que este máximo.
      NEXUS_BACKUP_DIR:           /backups
      NEXUS_BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-26}"
    volumes:
      # Persistencia de datos runtime (SQLite, skills, etc.)
      - nexus_data:/app/data
      # Copias de seguridad, solo lectura: para vigilar que se siguen haciendo.
      - nexus_backups:/backups:ro
      # User skills persist under nexus_data; bundled skills are seeded once.
    # Acceso al host Windows (para Ollama)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # API HTTP solo en el host local: en producción va detrás de un proxy
      # HTTPS (los tokens nunca deben viajar en claro). NEXUS_BIND=0.0.0.0 la
      # expone en la red, solo para pruebas en una red de confianza.
      - "${NEXUS_BIND:-127.0.0.1}:8787:8787"
      # MITM proxy (opcional, comentado por defecto)
      # - "127.0.0.1:8788:8788"
    networks:
      - nexus_internal
      - nexus_public
      - nexus_edge
    # Seguridad
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────────────────────────
  # BACKUP — copia diaria de la base de datos (scripts/db-backup.sh)
  # Cada copia se verifica con pg_restore antes de guardarse; se conservan
  # BACKUP_KEEP_DAYS días en el volumen nexus_backups. Cópialas también fuera
  # del servidor. Restaurar: docs/engineering/BACKUP_RESTORE.md
  # ─────────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: nexus-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST:     postgres
      PGUSER:     ${POSTGRES_USER:-nexus}
      PGPASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      PGDATABASE: ${POSTGRES_DB:-nexus}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS:      ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - nexus_backups:/backups
      - ./scripts/db-backup.sh:/usr/local/bin/db-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db-backup.sh", "--loop"]
    networks:
      - nexus_internal
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────
  # HTTPS — proxy público con certificado automático (deploy/Caddyfile)
  # Solo con el perfil "https" (make up-https). NEXUS_DOMAIN debe apuntar a
  # este servidor y los puertos 80/443 estar abiertos para emitir el
  # certificado; los certificados se guardan en el volumen caddy_data.
  # ─────────────────────────────────────────────────────────────
  https:
    image: caddy:2.8.4-alpine
    container_name: nexus-https
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      NEXUS_DOMAIN: ${NEXUS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      nexus_edge:
        ipv4_address: ${NEXUS_PROXY_IP:-172.29.80.10}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ───────────────────────────────────────────────────────────────
# VOLUMES — Persistencia
# ───────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: nexus_pgdata
  nexus_data:
    name: nexus_data
  nexus_backups:
    name: nexus_backups
  caddy_data:
    name: nexus_caddy_data
  caddy_config:
    name: nexus_caddy_config

# ───────────────────────────────────────────────────────────────
# NETWORKS — Segmentación
# ───────────────────────────────────────────────────────────────
networks:
  # Red interna aislada (postgres + orchestrator)
  nexus_internal:
    name: nexus_internal
    driver: bridge
    internal: true

  # Red pública limitada (solo orchestrator, para Ollama en host)
  nexus_public:
    name: nexus_public
    driver: bridge

  # Red del proxy HTTPS (https + orchestrator). Subred fija para que el
  # backend reconozca al proxy por su IP (NEXUS_PROXY_IP).
  nexus_edge:
    name: nexus_edge
    driver: bridge
    ipam:
      config:
        - subnet: ${NEXUS_EDGE_SUBNET:-172.29.80.0/24}
