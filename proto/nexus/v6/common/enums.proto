syntax = "proto3";
package nexus.v6.common;

option go_package = "github.com/nexus-ia/nexus/gen/go/nexus/v6/common;common";

enum AgentType {
  AGENT_TYPE_UNSPECIFIED       = 0;
  AGENT_TYPE_RED               = 1;
  AGENT_TYPE_BLUE              = 2;
  AGENT_TYPE_PREDICTION        = 3;
  AGENT_TYPE_SWARM_COORDINATOR = 4;
  AGENT_TYPE_SCOUT             = 5;
  AGENT_TYPE_ENUM              = 6;
  AGENT_TYPE_EXPLOIT_NET       = 7;
  AGENT_TYPE_EXPLOIT_WEB       = 8;
  AGENT_TYPE_POST_EXPLOIT      = 9;
  AGENT_TYPE_STEALTH           = 10;
}

enum ActionType {
  ACTION_TYPE_UNSPECIFIED      = 0;
  ACTION_TYPE_EXEC_FILELESS    = 1;
  ACTION_TYPE_ROTATE_VPN       = 2;
  ACTION_TYPE_ISOLATE_HOST     = 3;
  ACTION_TYPE_DEPLOY_DECOY     = 4;
  ACTION_TYPE_RUN_SCAN         = 5;
  ACTION_TYPE_RUN_EXPLOIT      = 6;
  ACTION_TYPE_DUMP_CREDENTIALS = 7;
  ACTION_TYPE_LATERAL_MOVE     = 8;
  ACTION_TYPE_GENERATE_PAYLOAD = 9;
  ACTION_TYPE_EVOLVE_MODULE    = 10;
  ACTION_TYPE_QUERY_KNOWLEDGE  = 11;
}

enum StatusCode {
  STATUS_CODE_UNSPECIFIED  = 0;
  STATUS_CODE_NEXUS_OK     = 1;
  STATUS_CODE_OPSEC_VETO   = 2;
  STATUS_CODE_ETHICAL_VETO = 3;
  STATUS_CODE_RATE_LIMITED = 4;
  STATUS_CODE_REPLAY       = 5;
  STATUS_CODE_NOT_IN_ANS   = 6;
  STATUS_CODE_ROGUE_AGENT  = 7;
  STATUS_CODE_RSI_ALERT    = 8;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY     = 1;
  HEALTH_STATUS_DEGRADED    = 2;
  HEALTH_STATUS_ANOMALOUS   = 3;
  HEALTH_STATUS_ROGUE       = 4;
}

enum SignatureAlgorithm {
  SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  SIGNATURE_ALGORITHM_DILITHIUM2  = 1;
  SIGNATURE_ALGORITHM_DILITHIUM3  = 2;
  SIGNATURE_ALGORITHM_DILITHIUM5  = 3;
  SIGNATURE_ALGORITHM_ED25519     = 4;
}

enum KemAlgorithm {
  KEM_ALGORITHM_UNSPECIFIED = 0;
  KEM_ALGORITHM_KYBER512    = 1;
  KEM_ALGORITHM_KYBER768    = 2;
  KEM_ALGORITHM_KYBER1024   = 3;
  KEM_ALGORITHM_X25519      = 4;
}
